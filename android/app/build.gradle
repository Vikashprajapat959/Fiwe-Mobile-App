
plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    namespace = "com.app.fiwe"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.app.fiwe"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }
    signingConfigs {
        release {
            // Only set signing config values if they are present in key.properties
            if (keystoreProperties['keyAlias']) {
                keyAlias keystoreProperties['keyAlias']
            }
            if (keystoreProperties['keyPassword']) {
                keyPassword keystoreProperties['keyPassword']
            }
            def storeFilePath = keystoreProperties['storeFile']
            if (storeFilePath != null && storeFilePath.toString().trim()) {
                storeFile file(storeFilePath)
            }
            if (keystoreProperties['storePassword']) {
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'        }
    }
    
    // Ensure consistent JVM target across all build variants
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

// Force all subprojects to use the same JVM target
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
            project.android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
            
            if (project.android.hasProperty('kotlinOptions')) {
                project.android.kotlinOptions.jvmTarget = "17"
            }
        }
        
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions.jvmTarget = "17"
        }
    }
      configurations.all {
        resolutionStrategy {
            force "com.google.android.play:core:1.10.3"
            force "com.google.android.play:core-common:2.0.3"

            eachDependency { details ->
                if (details.requested.group == "com.google.android.play" &&
                        (details.requested.name == "core" || details.requested.name == "core-common")) {
                    // Use only one version of play core libs everywhere
                    details.useVersion "1.10.3"
                    details.because("Avoid duplicate class definitions in play-core and play-core-common")
                }
            }
        }
    }
}
